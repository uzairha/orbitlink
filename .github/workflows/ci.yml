name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          # Caches ~/.m2 keyed on the pom files, so a build that changes no
          # dependencies does not re-download the world.
          cache: maven

      # No Docker setup step is needed: ubuntu-latest runners ship with a
      # running Docker daemon, which is what Testcontainers requires to start
      # the PostgreSQL container used by the integration tests.
      - name: Build, test and verify
        run: mvn --batch-mode --no-transfer-progress verify

      # Uploaded even on failure — when a test fails in CI, the surefire and
      # failsafe reports are the only way to see why without a local repro.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
          if-no-files-found: ignore
          retention-days: 7
